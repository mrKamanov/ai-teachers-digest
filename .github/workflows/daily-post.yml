name: Factum Daily Post

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factum-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Trust MAX TLS certificates
        run: |
          echo | openssl s_client -connect platform-api2.max.ru:443 -showcerts 2>/dev/null \
            | awk '/BEGIN CERT/,/END CERT/' > /tmp/max-certs.pem
          cat /etc/ssl/certs/ca-certificates.crt /tmp/max-certs.pem > /tmp/ca-bundle.pem
          echo "SSL_CERT_FILE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"

      - name: Generate and publish post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: python scripts/daily_post.py

      - name: Commit post and history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "post: $(date +%Y-%m-%d)"
          git push