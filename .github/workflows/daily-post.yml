name: Factum Daily Post

on:
  schedule:
    # Каждые 2 часа с 14:00 до 00:00 МСК. cron у GitHub ненадёжен
    # (бывает, задерживает на часы или пропускает вовсе) — чем больше
    # слотов, тем выше шанс, что пост выйдет в тот же день.
    # Защита published_to_max гарантирует ровно одну публикацию в день.
    - cron: "0 11,13,15,17,19,21 * * *"
  workflow_dispatch:
    inputs:
      republish_date:
        description: "Опубликовать заново пост за дату YYYY-MM-DD (пусто = обычный режим)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: factum-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Trust MAX TLS certificates
        run: |
          {
            cat /etc/ssl/certs/ca-certificates.crt
            sed 's/\r$//' certs/russian_trusted_root_ca.pem
            echo
            sed 's/\r$//' certs/russian_trusted_sub_ca.pem
            echo
          } > /tmp/ca-bundle.pem
          echo "SSL_CERT_FILE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"

      - name: Generate and publish post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: python scripts/daily_post.py

      - name: Commit post and history
        if: always()
        run: |
          git config user.name "mrKamanov"
          git config user.email "115507635+mrKamanov@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "post: $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "push failed, attempt $i/3 — retrying in 10s"
            sleep 10
          done
          exit 1